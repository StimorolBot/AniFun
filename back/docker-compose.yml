services:
  redis:
    image: redis:7.2.6
    container_name: redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - 6379:6379
    restart: always
    volumes:
      - ./data/redis:/data/redis
  minio:
    image: minio/minio
    container_name: minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - 9001:9001
      - 9000:9000
    networks:
      - server_net
    volumes:
      - ./data/minio:/data/minio
    command: server /data/minio --console-address ":9001"
    healthcheck:
      test: [ "CMD", "mc", "health", "minio" ]
      interval: 30s
      timeout: 20s
      retries: 3



networks:
  server_net:
    driver: bridge
